version: "3.9"
services:
  zeitfokus:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    environment:
      ZEITFOKUS_DEFAULT_USER_NAME: "admin"
      ZEITFOKUS_DEFAULT_USER_PASS: "admin"

      ZEITFOKUS_LOG_LEVEL: debug
    ports:
      - 3030:3030
    volumes:
      - ./zeitfokus-data:/opt/zeitfokus/data
