name: Hardened candidate
on:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this tested revision as an immutable candidate image
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  validate:
    # Keep the build stable across GitHub's future ubuntu-latest migrations.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.3
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install --global yarn@1.22.22
      - run: yarn install --frozen-lockfile --ignore-scripts && yarn generate
        working-directory: ui
      - run: |
          go install github.com/99designs/gqlgen@v0.17.85
          "$(go env GOPATH)/bin/gqlgen" generate
      - run: go mod tidy
      - run: yarn tsc --noEmit && yarn lint:check && yarn test && yarn build
        working-directory: ui
      - run: go test -race ./... && go vet ./...
      - run: go build -o /tmp/traggo-language-test . && python3 tests/interface_language.py --binary /tmp/traggo-language-test
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.hardened
          load: true
          tags: zeitfokus-server-base:local
          build-args: SOURCE_REVISION=${{ github.sha }}
      - run: docker build -f Dockerfile.zeitfokus --build-arg ZEITFOKUS_SERVER_IMAGE=zeitfokus-server-base:local --build-arg SOURCE_REVISION=${{ github.sha }} -t ghcr.io/weltenbummlerka/zeitfokus:sha-${{ github.sha }} -t ghcr.io/weltenbummlerka/zeitfokus:stable .
      - run: python3 tests/container/container_smoke.py ghcr.io/weltenbummlerka/zeitfokus:sha-${{ github.sha }}
      - name: Reject publish outside protected release refs
        if: >-
          github.event_name == 'workflow_dispatch' && inputs.publish &&
          github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "Publishing is allowed only from main or a version tag (v*)."
          exit 1
      - uses: docker/login-action@v3
        if: >-
          github.event_name == 'workflow_dispatch' && inputs.publish &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish Zeitfokus image
        if: >-
          github.event_name == 'workflow_dispatch' && inputs.publish &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          docker push ghcr.io/weltenbummlerka/zeitfokus:sha-${{ github.sha }}
          docker push ghcr.io/weltenbummlerka/zeitfokus:stable
