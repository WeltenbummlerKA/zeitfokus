name: Hardened candidate
on:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this tested revision as an immutable candidate image
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: 1.25.14
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install --global yarn@1.22.22
      - run: yarn install --frozen-lockfile --ignore-scripts && yarn generate
        working-directory: ui
      - run: go install github.com/99designs/gqlgen@v0.17.85 && gqlgen generate
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.3
      - run: yarn tsc --noEmit && yarn lint:check && yarn test && yarn build
        working-directory: ui
      - run: go test -race ./... && go vet ./...
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          file: Dockerfile.hardened
          platforms: linux/amd64
          push: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
          tags: ghcr.io/weltenbummlerka/traggo-server:sha-${{ github.sha }}
          build-args: SOURCE_REVISION=${{ github.sha }}
      - run: echo 'Image digest ${{ steps.image.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
