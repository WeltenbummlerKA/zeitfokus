name: Security audit

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript-typescript]
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

  go-security:
    name: Go vulnerability and security scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.1'
      - name: Generate gqlgen sources
        run: |
          go install github.com/99designs/gqlgen@v0.17.85
          "$(go env GOPATH)/bin/gqlgen" generate
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
      - name: Tidy Go modules
        run: go mod tidy
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.22.8
          "$(go env GOPATH)/bin/gosec" ./...

  frontend-security:
    name: Frontend dependency audit
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: yarn
          cache-dependency-path: ui/yarn.lock
      - run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - run: yarn install --frozen-lockfile --ignore-scripts
      - run: yarn audit --groups dependencies

  secrets-and-filesystem:
    name: Secrets and filesystem scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          skip-dirs: docker
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          exit-code: '1'

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
